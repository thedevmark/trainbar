name: Release build

# When a GitHub release is published, build Trainbar.exe and attach it,
# so people without Python can download and run it.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover tests
      - name: Icon
        run: >
          python -c "import importlib.machinery as m, importlib.util as u;
          l = m.SourceFileLoader('tb', 'trainbar.pyw'); s = u.spec_from_loader('tb', l);
          t = u.module_from_spec(s); l.exec_module(t); t.write_ico('trainbar.ico')"
      - run: python -m PyInstaller --onefile --windowed --name Trainbar --icon trainbar.ico trainbar.pyw
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/Trainbar.exe --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: Trainbar
          path: dist/Trainbar.exe
